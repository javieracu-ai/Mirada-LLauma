<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Prospectos — Panel de Administración</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #111;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 22px;
            margin: 0;
        }
        .badge {
            background: #111;
            color: white;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #444;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fcfcfc;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Panel de Prospectos (CRM)</h1>
            <span class="badge">El Constructor</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo electrónico</th>
                    <th>WhatsApp</th>
                    <th>Fecha de registro</th>
                </tr>
            </thead>
            <tbody>
                {% for prospecto in prospectos %}
                <tr>
                    <td>{{ prospecto[0] }}</td>
                    <td><strong>{{ prospecto[1] }}</strong></td>
                    <td>{{ prospecto[2] }}</td>
                    <td>{{ prospecto[3] }}</td>
                    <td>{{ prospecto[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="/" class="back-link">← Volver a la Landing Page</a>
    </div>

</body>
</html>
