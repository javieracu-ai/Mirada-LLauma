<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Mirada LLauma</title>
    <style>
        body {
            margin: 0;
            padding: 32px;
            background: #f5f6f8;
            color: #202124;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 20px;
        }
        .table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e2e5e9;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e5e9;
            text-align: left;
        }
        th {
            background: #f8f9fa;
        }
        tr:last-child td {
            border-bottom: 0;
        }
        select {
            padding: 6px 8px;
        }
        .empty {
            padding: 24px;
            color: #666;
            text-align: center;
        }
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Prospectos</h1>
        <div class="table-wrap">
            {% if prospectos %}
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>WhatsApp</th>
                            <th>Assistant's Name</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for prospecto in prospectos %}
                            <tr>
                                <td>{{ prospecto[1] }}</td>
                                <td>{{ prospecto[2] }}</td>
                                <td>{{ prospecto[3] or '' }}</td>
                                <td>
                                    <form action="{{ url_for('actualizar_assistant', id=prospecto[0]) }}" method="POST" style="margin: 0;">
                                        <select name="assistant_name" onchange="this.form.submit()" aria-label="Assistant's Name para {{ prospecto[1] }}">
                                            <option value="1" {% if prospecto[4] == '1' %}selected{% endif %}>1</option>
                                            <option value="2" {% if prospecto[4] == '2' %}selected{% endif %}>2</option>
                                            <option value="3" {% if prospecto[4] == '3' %}selected{% endif %}>3</option>
                                        </select>
                                    </form>
                                </td>
                                <td>{{ prospecto[5] or '' }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p class="empty">Todavía no hay prospectos registrados.</p>
            {% endif %}
        </div>
    </main>
</body>
</html>
